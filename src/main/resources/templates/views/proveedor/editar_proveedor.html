<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Editar Proveedor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Editar Proveedor</h2>
    <form th:action="@{/views/proveedores/save}" th:object="${proveedor}" method="post" class="col-md-6">
        <input type="hidden" th:field="*{idProveedor}">
        <div class="mb-3">
            <label class="form-label">Nombre:</label>
            <input type="text" class="form-control" th:field="*{nombre}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Contacto:</label>
            <input type="text" class="form-control" th:field="*{contacto}">
        </div>
        <div class="mb-3">
            <label class="form-label">Teléfono:</label>
            <input type="text" class="form-control" th:field="*{telefono}">
        </div>
        <div class="mb-3">
            <label class="form-label">Email:</label>
            <input type="email" class="form-control" th:field="*{email}">
        </div>
        <div class="mb-3">
            <label class="form-label">Dirección:</label>
            <textarea class="form-control" th:field="*{direccion}" rows="3"></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Actualizar</button>
        <a th:href="@{/views/proveedores/}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
</body>
</html>
