<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-info">
    <div class="container-fluid">
        <a class="navbar-brand text-white text-decoration-none fw-bold" 
   href="#" onclick="document.getElementById('myFrame').src='/bienvenida'">
   🏪 Sistema de Inventario y Ventas
</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/views/usuarios/}" target="myFrame">Usuarios</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/views/categorias/}" target="myFrame">Categorías</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/views/proveedores/}" target="myFrame">Proveedores</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/views/productos/}" target="myFrame">Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-white" th:href="@{/views/ventas/}" target="myFrame">Ventas</a>
                </li>
            </ul>
            <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Cerrar Sesión</a>
        </div>
    </div>
</nav>
<div class="container-fluid" style="height: 90vh;">
    <iframe name="myFrame" id="myFrame" src="/bienvenida" 
            style="width:100%; height:100%; border:none;"></iframe>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
