<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Bienvenido</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .bienvenida-card {
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .icon-grande {
            font-size: 5rem;
        }
    </style>
</head>
<body>
<div class="container mt-5">
    <div class="card bienvenida-card p-5 text-center">
        <div class="icon-grande mb-3">🏪</div>
        <h2 class="fw-bold text-info">Bienvenido al Sistema de Inventario y Ventas</h2>
        <p class="text-muted mt-3 fs-5">
            Usa el menú superior para navegar entre los módulos del sistema.
        </p>
        <hr>
        <div class="row mt-4 text-center">
            <div class="col-md-3">
                <div class="p-3 bg-light rounded">
                    <div style="font-size:2rem">👥</div>
                    <p class="mt-2 fw-semibold">Usuarios</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-light rounded">
                    <div style="font-size:2rem">📦</div>
                    <p class="mt-2 fw-semibold">Productos</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-light rounded">
                    <div style="font-size:2rem">🚚</div>
                    <p class="mt-2 fw-semibold">Proveedores</p>
                </div>
            </div>
            <div class="col-md-3">
                <div class="p-3 bg-light rounded">
                    <div style="font-size:2rem">💰</div>
                    <p class="mt-2 fw-semibold">Ventas</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
