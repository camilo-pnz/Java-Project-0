<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Productos</h2>
    <a th:href="@{/views/productos/new}" class="btn btn-success mb-3">Nuevo Producto</a>
    <table class="table table-hover table-bordered">
        <thead class="table-info">
            <tr>
                <th>Código</th>
                <th>Nombre</th>
                <th>Categoría</th>
                <th>Proveedor</th>
                <th>Precio Compra</th>
                <th>Precio Venta</th>
                <th>IVA (%)</th>
                <th>Stock</th>
                <th>Stock Mínimo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="producto : ${listaProductos}"
                th:classappend="${producto.stock < producto.stockMinimo} ? 'table-danger' : ''">
                <td th:text="${producto.codigo}"></td>
                <td th:text="${producto.nombre}"></td>
                <td th:text="${producto.categoria != null ? producto.categoria.nombre : 'Sin categoría'}"></td>
                <td th:text="${producto.proveedor != null ? producto.proveedor.nombre : 'Sin proveedor'}"></td>
                <td th:text="${producto.precioCompra}"></td>
                <td th:text="${producto.precioVenta}"></td>
                <td th:text="${producto.iva}"></td>
                <td th:text="${producto.stock}"></td>
                <td th:text="${producto.stockMinimo}"></td>
                <td>
                    <a th:href="@{'/views/productos/listar/' + ${producto.idProducto}}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{'/views/productos/delete/' + ${producto.idProducto}}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
    <small class="text-danger">● Filas en rojo indican stock por debajo del mínimo.</small>
</div>
</body>
</html>
