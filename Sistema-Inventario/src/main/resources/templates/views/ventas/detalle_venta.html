<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Detalle Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Detalle de Venta #<span th:text="${venta.idVenta}"></span></h2>
    <div class="mb-3">
        <strong>Fecha:</strong> <span th:text="${venta.fechaVenta}"></span><br>
        <strong>Usuario:</strong> <span th:text="${venta.usuario.username}"></span><br>
        <strong>Estado:</strong> <span th:text="${venta.estado}"></span>
    </div>
    <table class="table table-bordered">
        <thead class="table-info">
            <tr>
                <th>Producto</th>
                <th>Precio Unitario</th>
                <th>Cantidad</th>
                <th>Subtotal</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="detalle : ${venta.detalles}">
                <td th:text="${detalle.producto.nombre}"></td>
                <td th:text="${detalle.precioUnitario}"></td>
                <td th:text="${detalle.cantidad}"></td>
                <td th:text="${detalle.subtotal}"></td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3" class="text-end"><strong>Total:</strong></td>
                <td th:text="${venta.total}"></td>
            </tr>
        </tfoot>
    </table>
    <a th:href="@{/views/ventas/}" class="btn btn-secondary">Volver</a>
</div>
</body>
</html>
