<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nueva Venta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Nueva Venta</h2>
    <form th:action="@{/views/ventas/save}" method="post">
        <table class="table table-bordered" id="tablaProductos">
            <thead class="table-info">
                <tr>
                    <th>Producto</th>
                    <th>Precio Venta</th>
                    <th>Cantidad</th>
                    <th>Subtotal</th>
                    <th>Acción</th>
                </tr>
            </thead>
            <tbody id="filas">
                <tr>
                    <td>
                        <select name="productoIds" class="form-select producto-select" onchange="actualizarPrecio(this)">
                            <option value="">-- Seleccione --</option>
                            <option th:each="p : ${listaProductos}"
                                    th:value="${p.idProducto}"
                                    th:text="${p.nombre + ' (Stock: ' + p.stock + ')'}"
                                    th:data-precio="${p.precioVenta}"></option>
                        </select>
                    </td>
                    <td><input type="text" class="form-control precio" readonly value="0"></td>
                    <td><input type="number" name="cantidades" class="form-control cantidad" min="1" value="1" oninput="calcularSubtotal(this)"></td>
                    <td><input type="text" class="form-control subtotal" readonly value="0"></td>
                    <td><button type="button" class="btn btn-danger btn-sm" onclick="eliminarFila(this)">X</button></td>
                </tr>
            </tbody>
        </table>
        <button type="button" class="btn btn-secondary mb-3" onclick="agregarFila()">+ Agregar Producto</button>
        <div class="mb-3">
            <h5>Total: $<span id="totalGeneral">0.00</span></h5>
        </div>
        <button type="submit" class="btn btn-success">Registrar Venta</button>
        <a th:href="@{/views/ventas/}" class="btn btn-secondary">Cancelar</a>
    </form>
</div>
<script>
    function actualizarPrecio(select) {
        const fila = select.closest('tr');
        const opcion = select.options[select.selectedIndex];
        const precio = opcion.getAttribute('data-precio') || '0';
        fila.querySelector('.precio').value = precio;
        calcularSubtotal(fila.querySelector('.cantidad'));
    }

    function calcularSubtotal(inputCantidad) {
        const fila = inputCantidad.closest('tr');
        const precio = parseFloat(fila.querySelector('.precio').value) || 0;
        const cantidad = parseInt(inputCantidad.value) || 0;
        const subtotal = precio * cantidad;
        fila.querySelector('.subtotal').value = subtotal.toFixed(2);
        calcularTotal();
    }

    function calcularTotal() {
        let total = 0;
        document.querySelectorAll('#filas .subtotal').forEach(input => {
            total += parseFloat(input.value) || 0;
        });
        document.getElementById('totalGeneral').textContent = total.toFixed(2);
    }

    function agregarFila() {
        const tbody = document.getElementById('filas');
        const primeraFila = tbody.rows[0];
        const nuevaFila = primeraFila.cloneNode(true);
        nuevaFila.querySelector('.producto-select').value = '';
        nuevaFila.querySelector('.precio').value = '0';
        nuevaFila.querySelector('.cantidad').value = '1';
        nuevaFila.querySelector('.subtotal').value = '0';
        tbody.appendChild(nuevaFila);
    }

    function eliminarFila(btn) {
        const tbody = document.getElementById('filas');
        if (tbody.rows.length > 1) {
            btn.closest('tr').remove();
            calcularTotal();
        }
    }
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
