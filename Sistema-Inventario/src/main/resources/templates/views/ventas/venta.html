<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ventas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Historial de Ventas</h2>
    <a th:href="@{/views/ventas/new}" class="btn btn-success mb-3">Nueva Venta</a>
    <table class="table table-hover table-bordered">
        <thead class="table-info">
            <tr>
                <th>ID</th>
                <th>Fecha</th>
                <th>Usuario</th>
                <th>Subtotal</th>
                <th>Total</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="venta : ${listaVentas}"
                th:classappend="${venta.estado.name() == 'ANULADA'} ? 'table-danger' : ''">
                <td th:text="${venta.idVenta}"></td>
                <td th:text="${venta.fechaVenta}"></td>
                <td th:text="${venta.usuario.username}"></td>
                <td th:text="${venta.subtotal}"></td>
                <td th:text="${venta.total}"></td>
                <td th:text="${venta.estado}"></td>
                <td>
                    <a th:href="@{'/views/ventas/detalle/' + ${venta.idVenta}}" class="btn btn-info btn-sm">Detalle</a>
                    <a th:if="${venta.estado.name() == 'COMPLETADA'}"
                       th:href="@{'/views/ventas/anular/' + ${venta.idVenta}}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('¿Anular esta venta?')">Anular</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
