<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Usuarios</h2>
    <a th:href="@{/views/usuarios/new}" class="btn btn-success mb-3">Nuevo Usuario</a>
    <table class="table table-hover table-bordered">
        <thead class="table-info">
            <tr>
                <th>ID</th>
                <th>Username</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Email</th>
                <th>Rol</th>
                <th>Activo</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="usuario : ${listaUsuarios}">
                <td th:text="${usuario.idUsuario}"></td>
                <td th:text="${usuario.username}"></td>
                <td th:text="${usuario.nombre}"></td>
                <td th:text="${usuario.apellido}"></td>
                <td th:text="${usuario.email}"></td>
                <td th:text="${usuario.rol}"></td>
                <td th:text="${usuario.activo ? 'Sí' : 'No'}"></td>
                <td>
                    <a th:href="@{'/views/usuarios/listar/' + ${usuario.idUsuario}}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{'/views/usuarios/delete/' + ${usuario.idUsuario}}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
