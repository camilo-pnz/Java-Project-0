<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Proveedores</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-4">
    <h2>Listado de Proveedores</h2>
    <a th:href="@{/views/proveedores/new}" class="btn btn-success mb-3">Nuevo Proveedor</a>
    <table class="table table-hover table-bordered">
        <thead class="table-info">
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Contacto</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Dirección</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="proveedor : ${listaProveedores}">
                <td th:text="${proveedor.idProveedor}"></td>
                <td th:text="${proveedor.nombre}"></td>
                <td th:text="${proveedor.contacto}"></td>
                <td th:text="${proveedor.telefono}"></td>
                <td th:text="${proveedor.email}"></td>
                <td th:text="${proveedor.direccion}"></td>
                <td>
                    <a th:href="@{'/views/proveedores/listar/' + ${proveedor.idProveedor}}" class="btn btn-warning btn-sm">Editar</a>
                    <a th:href="@{'/views/proveedores/delete/' + ${proveedor.idProveedor}}" class="btn btn-danger btn-sm">Eliminar</a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
</body>
</html>
