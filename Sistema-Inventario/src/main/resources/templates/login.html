<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema de Inventario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">
    <style>
        body {
            background-color: #f0f2f5;
        }
        .login-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            border-radius: 12px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
        }
        .login-header {
            background-color: #17a2b8; /* bg-info igual al proyecto base */
            border-radius: 12px 12px 0 0;
            padding: 28px 24px 20px 24px;
            text-align: center;
        }
        .login-header img {
            height: 48px;
            margin-bottom: 10px;
        }
        .login-header h4 {
            color: #fff;
            font-weight: 600;
            margin: 0;
        }
        .login-header p {
            color: rgba(255,255,255,0.85);
            font-size: 0.88rem;
            margin: 4px 0 0 0;
        }
        .login-body {
            background: #fff;
            border-radius: 0 0 12px 12px;
            padding: 28px 32px 32px 32px;
        }
        .btn-login {
            background-color: #17a2b8;
            border-color: #17a2b8;
            color: #fff;
            width: 100%;
            padding: 10px;
            font-size: 1rem;
            border-radius: 6px;
        }
        .btn-login:hover {
            background-color: #138496;
            border-color: #117a8b;
            color: #fff;
        }
        .divider {
            height: 1px;
            background-color: rgba(0,0,0,.10);
            margin: 18px 0;
        }
        footer {
            text-align: center;
            color: #6c757d;
            font-size: 0.82rem;
            margin-top: 24px;
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card">

        <!-- Encabezado -->
        <div class="login-header">
            <h4>&#128230; Sistema de Inventario y Ventas</h4>
            <p>Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Cuerpo del formulario -->
        <div class="login-body">

            <!-- Alerta de error -->
            <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
                <strong>&#10060; Error:</strong> <span th:text="${error}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Alerta de logout exitoso -->
            <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show" role="alert">
                <strong>&#9989;</strong> <span th:text="${mensaje}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>

            <!-- Formulario — Spring Security procesa el POST en /login -->
            <form th:action="@{/login}" method="post">

                <!-- Token CSRF (Thymeleaf lo inyecta automáticamente) -->

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Usuario</label>
                    <input type="text"
                           id="username"
                           name="username"
                           class="form-control"
                           placeholder="Ingresa tu usuario"
                           required
                           autofocus />
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label fw-semibold">Contraseña</label>
                    <input type="password"
                           id="password"
                           name="password"
                           class="form-control"
                           placeholder="Ingresa tu contraseña"
                           required />
                </div>

                <div class="divider"></div>

                <button type="submit" class="btn btn-login">
                    Iniciar Sesión
                </button>

            </form>
        </div>
    </div>
</div>

<footer>Derechos de Autor &copy; 2025 &mdash; Sistema de Inventario y Ventas</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ka7Sk0Gln4gmtz2MlQnikT1wXgYsOg+OMhuP+IlRH9sENBO0LRn5q+8nbTov4+1p"
        crossorigin="anonymous"></script>
</body>
</html>
